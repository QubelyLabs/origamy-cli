name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile every release target
        run: make build-all
      - name: Known-vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Supply-chain gate. The 2026 GlassWorm wave force-pushed forged merges
      # into this repo carrying .vscode/tasks.json (auto-run on folder open) and
      # payloads disguised as .woff2 fonts. Same script as origamy-control-plane.
      - name: Hidden-code / masqueraded-payload scan
        run: ./scripts/check-hidden-code.sh .
